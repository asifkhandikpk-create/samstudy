<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Study Notes</title>
   
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ======== GLOBAL RESPONSIVE NAVIGATION BAR ======== -->
    <nav class="navbar">
        <div class="nav-containerr">
            <a href="index.html" class="nav-logo">📚 EduNotes</a>
            
            <!-- Real-time Interactive Search Component Box wrapper -->
            <div class="search-wrapperr">
                <input type="text" id="navbarSearchInput" placeholder="Search topics..." autocomplete="off">
                <ul id="suggestions_listbox" class="suggestions-dropdown" style="display: none;"></ul>
            </div>

            <!-- Responsive Document Action Layout Block Button -->
            <button id="navbarDownloadDocBtn" class="nav-download-btn" title="Download Entire Topic">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span class="btn-text">Download</span>
            </button>
        </div>
    </nav>

    <!-- ======== MAIN VIEWPORT WRAPPER ======== -->
    <main class="reading-viewport-area">
        <!-- Target Document Header Title Block Meta Info Data -->
        <div class="document-header-meta">
            <h1 id="documentTitle">Loading Topic Contents...</h1>
        </div>

        <!-- Continuous Scrollable Page Container Target Wrapper Element -->
        <div id="documentContentBody">
            
        </div>
    </main>

    <!-- Core Database file dependency context followed by active engine routines -->
    <script src="data.js"></script>
    <script src="reading-engine.js"></script>
</body>
</html>
