<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State</title>
    <!-- Linking Separate Stylesheet -->
    <link rel="stylesheet" href="state.css">
</head>

<body>

    <!-- Fixed Navigation Bar -->
    <div class="nav-container">
        <div class="nav-logo">
            <a href="index.html">EduNotes | Zabalix</a>
        </div>
        <div class="search-wrapper">
            <input type="text" id="navbarSearchInput" placeholder="Search notes by keywords...">
        </div>
        <div class="nav-actions">

            <button class="nav-download-btn" id="exportBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span class="btn-text">Download</span>
            </button>
        </div>
    </div>

    <!-- Read-Only Viewport Area -->
    <div class="reading-viewport-area">

        <!-- Master Title Header Block -->
        <div class="sam-rm-master-wrapper">
            <div class="sam-rm-content">
                <h1 class="sam-rm-title" id="mainNotebookTitle">Political Science: State Notes Archive</h1>
                <div class="sam-rm-meta">Published Documentation • Read-Only Reference Module</div>
            </div>
        </div>

        <!-- Hidden layout helper block per layout spec -->
        <div class="document-header-meta">Hidden Structural Frame Payload</div>

        <!-- Sheets Container Element Area -->
        <div id="sheetsContainer"></div>

    </div>

    <!-- Linking JavaScript Modules Separately -->
    <!-- Place this right before the closing </body> tag -->
    <script src="state.js" defer></script>
    <script src="app.js" defer></script>

</body>

</html>
